[package]
name = "communal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description.workspace = true
keywords = ["graph", "community-detection", "leiden", "louvain", "graphrag"]
categories = ["algorithms", "data-structures", "science"]

[workspace]
members = [
    "crates/communal-core",
    "crates/communal-algo",
    "crates/communal-dynamic",
    "crates/communal-petgraph",
    "crates/communal-metrics",
    "crates/communal-generators",
    "crates/communal-wasm",
    "crates/communal-cli",
    "crates/communal-tui",
    "crates/communal-frontend",
    "crates/communal-benches",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["MDMV - Laboratório de Soluções Digitais"]
license = "MIT OR Apache-2.0"
description = "High-performance community detection framework in pure Rust with petgraph and dynamic graph support."
repository = "https://github.com/MDMV-Laboratorio-de-Solucoes-Digitais/communal"
homepage = "https://github.com/MDMV-Laboratorio-de-Solucoes-Digitais/communal"
documentation = "https://docs.rs/communal"

[workspace.dependencies]
communal-core = { path = "crates/communal-core" }
communal-algo = { path = "crates/communal-algo" }
communal-dynamic = { path = "crates/communal-dynamic" }
communal-petgraph = { path = "crates/communal-petgraph" }
communal-metrics = { path = "crates/communal-metrics" }
communal-generators = { path = "crates/communal-generators" }
communal-wasm = { path = "crates/communal-wasm" }
communal-cli = { path = "crates/communal-cli" }
communal-tui = { path = "crates/communal-tui" }
communal-frontend = { path = "crates/communal-frontend" }
communal-benches = { path = "crates/communal-benches" }
petgraph = { version = "0.8.3", default-features = false }
rayon = "1.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
wasm-bindgen = "0.2"
proptest = "1.6"
criterion = { version = "0.8.2", features = ["html_reports"] }
num-traits = "0.2.19"
tracing = "0.1.44"
rand_chacha = "0.9"
rustc-hash = "2.0"
dhat = "0.3"

[dependencies]
communal-core = { workspace = true }
communal-algo = { workspace = true, optional = true }
communal-dynamic = { workspace = true, optional = true }
communal-petgraph = { workspace = true, optional = true }
communal-metrics = { workspace = true, optional = true }
communal-generators = { workspace = true, optional = true }

[features]
default = ["algo", "petgraph", "metrics"]
algo = ["dep:communal-algo"]
dynamic = ["dep:communal-dynamic"]
petgraph = ["dep:communal-petgraph"]
metrics = ["dep:communal-metrics"]
generators = ["dep:communal-generators"]
full = ["algo", "dynamic", "petgraph", "metrics", "generators"]

[profile.dev]
opt-level = 0
debug = true
lto = false
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# =========================================================================
# Workspace Lint Configuration
# =========================================================================
# This block is pinned to the authoritative project lint configuration in
# `rust-code-rigor.md` (repository root). Any change to either file MUST be
# mirrored atomically; drift is caught by `scripts/check_lint_block.sh` (T002a)
# and CI fails on any divergence. Per Constitution §Rust Rigor Configuration
# and plan.md §Tech Stack Mandates.

[workspace.lints.rust]
# The basics of native compiler rigor
unsafe_code = "deny"                  # No unsafe blocks without explicit justification
missing_docs = "deny"                 # Requires documentation on everything public
missing_debug_implementations = "deny"# All public structs must implement Debug
unreachable_pub = "deny"              # Pub items that cannot be accessed publicly
unused_results = "deny"               # Forces handling of all returns (not just Results)
unused_qualifications = "deny"        # Avoids unnecessary absolute paths (e.g., std::vec::Vec)
trivial_casts = "deny"                # Forbids casts like `x as u32` if `x` is already `u32`
trivial_numeric_casts = "deny"        # Forbids useless numeric casts
unused_extern_crates = "deny"         # Cleans up dependency garbage

[workspace.lints.clippy]
# Level 1: The Main Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Level 2: The "Give Me a Reason" Rule
# -------------------------------------------------------------------------
# 1. Forbids the use of #[allow()] generally.
allow_attributes = "deny"

# 2. IF, because of a macro, you need to make a local exception and use
# an #[allow()], you are OBLIGATED to write the `reason = "..."` attribute.
#
allow_attributes_without_reason = "deny"
# Example:
#
# #[allow(
#    clippy::allow_attributes,
#    clippy::pedantic,
#    reason = "async_trait macro allows underscore bindings internally. Forgiven."
# )]
# [async_trait]

# Level 3: Panic Prevention and Technical Debt (The Restriction group)
# -------------------------------------------------------------------------
unwrap_used = "deny"                  # Forbids .unwrap() (use pattern matching or the ? operator)
expect_used = "deny"                  # Forbids .expect() (propagate the error gracefully)
panic = "deny"                        # Forbids the explicit panic!() macro
todo = "deny"                         # Forbids the todo!() macro in production code
unimplemented = "deny"                # Forbids the unimplemented!() macro
unreachable = "deny"                  # Forces clarity in unreachable paths
fallible_impl_from = "deny"           # Forbids impl From that can fail (use TryFrom)
clone_on_ref_ptr = "deny"             # Forces Arc::clone(&x) instead of x.clone() for clarity
dbg_macro = "deny"                    # Forbids dbg!() forgotten in the code
print_stdout = "warn"                 # Restricts print!/println! (use the `tracing` or `log` crate)
use_self = "deny"                     # Forces the use of `Self` in implementations for clean refactoring
wildcard_dependencies = "deny"        # Forbids `crate = "*"` type dependencies in Cargo.toml
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "deny"      # Forbids having multiple versions of the same crate compiled

[lints]
workspace = true
